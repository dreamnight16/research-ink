name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: AppImage
            args: ""
          - os: macos-latest
            target: macos
            ext: dmg
            args: ""
          - os: windows-latest
            target: windows
            ext: nsis
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev
          cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "研墨 v__VERSION__"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true

  # build-android is disabled: the mobile/ directory is a stub with no
