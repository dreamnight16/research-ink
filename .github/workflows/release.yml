name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            ext: AppImage
          - os: macos-latest
            target: macos
            ext: dmg
          - os: windows-latest
            target: windows
            ext: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "研墨 v__VERSION__"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd mobile && npm ci
      - name: Build web assets
        run: cd mobile && npm run build
      - name: Sync Capacitor
        run: cd mobile && npx cap sync android
      - name: Build APK
        run: cd mobile/android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yanmo-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
