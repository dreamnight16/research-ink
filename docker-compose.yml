services:
  yanmo:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - yanmo_data:/root/.yanmo
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  yanmo_data:
  ollama_data:
