[project]
name = "research-ink"
version = "1.0.0"
description = "研墨 · 本地优先的科研助手"
readme = "README.md"
license = "MIT"
authors = [
    { name = "DreamNight", email = "support@dreamnight.net.cn" }
]
keywords = ["research", "papers", "arxiv", "sympy", "llm", "ollama", "local-first", "academic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "sympy>=1.13.0",
    "scipy>=1.14.0",
    "feedparser>=6.0.0",
    "aiohttp>=3.9.0",
    "ollama>=0.4.0",
    "tenacity>=8.2.3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PySide6>=6.5.0",
]

[project.urls]
Homepage = "https://github.com/dreamnight16/ResearchInk"
Repository = "https://github.com/dreamnight16/ResearchInk.git"
Issues = "https://github.com/dreamnight16/ResearchInk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*", "frontend_qt", "frontend_qt.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["backend"]
