repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check backend/
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: ruff format --check backend/
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy backend/
        language: system
        types: [python]
        pass_filenames: false
